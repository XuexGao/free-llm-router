<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · free-llm-router</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230071E3'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='6' cy='19' r='2'/%3E%3Ccircle cx='18' cy='5' r='2'/%3E%3Cpath d='M8 19h6a4 4 0 0 0 0-8H10a4 4 0 0 1 0-8h6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/panel/style.css">
</head>
<body class="login-body">
<div class="login-card">
  <h1>free-llm-router</h1>
  <p class="hint">请输入 API 密钥以进入管理面板。</p>

  <form id="login-form" autocomplete="off">
    <input id="apikey" type="password" placeholder="API 密钥" autocomplete="current-password" autofocus>
    <button type="submit" id="login-btn">登录</button>
  </form>

  <p id="login-msg" class="login-msg"></p>

  <p class="hint login-foot">
    密钥在部署时通过 <code>wrangler secret put API_KEY</code> 设置。<br>
    它只存在本机浏览器（localStorage），每个请求以 <code>Authorization</code> 头发送。
  </p>
</div>

<script src="/panel/login.js"></script>
</body>
</html>
